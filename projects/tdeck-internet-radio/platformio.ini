; PlatformIO Project Configuration File
; Standalone Wi-Fi Internet Radio / Live News Streamer for LILYGO T-Deck (ESP32-S3FN16R8)

[env:lilygo-t-deck-radio]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; 16MB QIO Flash + 8MB OPI PSRAM (ESP32-S3FN16R8)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -mfix-esp32-psram-cache-issue

    ; TFT_eSPI configuration for LILYGO T-Deck ST7789 2.8" IPS (320x240 landscape)
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_CS=12
    -DTFT_DC=11
    -DTFT_RST=-1
    -DTFT_SCLK=40
    -DTFT_MOSI=41
    -DTFT_MISO=38
    -DTFT_BL=42
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.7
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0
