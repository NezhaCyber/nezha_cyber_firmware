name: Board Support Request
description: Request or contribute support for a new ESP32 / ESP32-S3 / ESP32-C5 board
title: "[Board]: "
labels: ["board-support"]
body:
  - type: input
    id: board_name
    attributes:
      label: Board Name & MCU
      placeholder: "e.g. LilyGO T-Deck Plus (ESP32-S3, 16MB Flash, 8MB PSRAM)"
    validations:
      required: true
  - type: textarea
    id: specs
    attributes:
      label: Hardware Specifications & Pinout Link
      description: Display controller, resolution, Flash/PSRAM size, input method (touch/buttons/keyboard), and official schematic link.
    validations:
      required: true
