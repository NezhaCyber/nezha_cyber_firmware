name: Deploy WebSerial Flasher & Companion (GitHub Pages)

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "tools/web_companion/**"
      - "tools/gen_web_manifests.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag for flasher manifests (default: latest)"
        required: false
        default: "latest"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-pages:
    name: Stage WebSerial Companion & Manifests
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout web companion & manifest generator
        uses: actions/checkout@v7
        with:
          sparse-checkout: tools

      - name: Resolve release tag
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stage static site and generate esp-web-tools manifests
        env:
          REPO_NAME: ${{ github.repository }}
          MANIFEST_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p _site/manifests
          if [ -d tools/web_companion ]; then
            cp -r tools/web_companion/* _site/
          else
            printf '%s\n' '<!doctype html><html><body><h1>Nezha Cyber WebSerial Portal</h1></body></html>' > _site/index.html
          fi
          python3 tools/gen_web_manifests.py \
            --out-dir _site/manifests \
            --repo "$REPO_NAME" \
            --tag "$MANIFEST_TAG"
          python3 -c 'import json; json.load(open("_site/manifests/boards.json", encoding="utf-8"))'
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
