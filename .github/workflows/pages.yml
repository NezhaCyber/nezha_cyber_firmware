name: Deploy Web Flasher Portal (GitHub Pages)

on:
  release:
    types: [published, edited]
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "tools/gen_web_manifests.py"
      - "tools/sync_portal_releases.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag for esp-web-tools manifests (default: latest)"
        required: false
        default: "latest"
        type: string
      sync_release_bins:
        description: "Mirror published GitHub Release .bin assets (stable + beta) into static Pages (same-origin, zero CORS)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & Stage Static Portal (/portal)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout portal & manifest tools only
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            portal
            tools

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: portal/package-lock.json

      - name: Install portal dependencies
        working-directory: portal
        run: npm ci --prefer-offline --no-audit

      - name: Run portal protocol & manifest unit tests
        working-directory: portal
        run: npm test

      - name: Build static production bundle
        working-directory: portal
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "$PAGES_BASE_PATH" ]; then
            export VITE_BASE_PATH="${PAGES_BASE_PATH%/}/"
          else
            export VITE_BASE_PATH="./"
          fi
          echo "Building static portal with VITE_BASE_PATH=$VITE_BASE_PATH"
          npm run build

      - name: Sync GitHub Releases (Stable + Beta + Archive) & stage static manifests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          SYNC_BINS: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_release_bins == true }}
        run: |
          if [ -n "$EVENT_TAG" ]; then
            TAG="$EVENT_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="latest"
          fi

          # Generate esp-web-tools manifests alongside the Vite SPA bundle
          python3 tools/gen_web_manifests.py \
            --out-dir portal/dist/manifests \
            --repo "$REPO_NAME" \
            --tag "$TAG"

          # Sync multi-version GitHub Releases (stable + beta + archive) + real memory sizes into portal manifest
          SYNC_ARGS=(--repo "$REPO_NAME" --dist-dir portal/dist --max-releases 12 --max-mirror-releases 4)
          if [ "$SYNC_BINS" = "true" ]; then
            SYNC_ARGS+=(--sync-bins)
          fi
          python3 tools/sync_portal_releases.py "${SYNC_ARGS[@]}"

      - name: Finalize static Pages output (.nojekyll, SPA 404 fallback, sanity check)
        run: |
          touch portal/dist/.nojekyll
          cp portal/dist/index.html portal/dist/404.html
          test -s portal/dist/index.html
          test -s portal/dist/404.html
          python3 -c 'import json; json.load(open("portal/dist/firmware/manifest.json", encoding="utf-8")); json.load(open("portal/dist/manifests/boards.json", encoding="utf-8"))'

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: portal/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
