name: Release — Nezha Cyber Firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Release (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - lilygo-t-deck
          - lilygo-t-deck-pro
          - m5stack-cplus1_1
          - m5stack-cplus2
          - m5stack-cardputer
          - m5stack-cores3
          - lilygo-t-embed-cc1101
          - CYD-2432S028
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-rel-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-rel-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.env }}
          path: NezhaCyber-${{ matrix.env }}.bin
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all firmware binaries
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: bin-*
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-artifacts
        run: sha256sum NezhaCyber-*.bin > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Nezha Cyber (哪吒网络安全) ${{ inputs.tag || github.ref_name }}"
          generate_release_notes: true
          files: |
            release-artifacts/NezhaCyber-*.bin
            release-artifacts/SHA256SUMS.txt
